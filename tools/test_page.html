<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anot ASR Tester</title>
<style>
  :root { --bg:#0f1420; --card:#171d2b; --line:#273043; --text:#e7ecf3; --muted:#9aa6b8; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:780px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; background:#0d1220; color:var(--text);
    border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:28px; text-align:center;
    color:var(--muted); cursor:pointer; transition:.15s; }
  #drop.hot { border-color:var(--accent); color:var(--text); background:#0d1220; }
  button { margin-top:14px; width:100%; padding:11px; font-size:15px; font-weight:600; cursor:pointer;
    background:var(--accent); color:#06122b; border:0; border-radius:9px; }
  button:disabled { opacity:.5; cursor:default; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0d1220; border:1px solid var(--line);
    border-radius:8px; padding:12px; font-size:13px; max-height:40vh; overflow:auto; }
  .pill { display:inline-block; font-size:12px; color:var(--muted); margin-right:14px; }
  .err { color:#ff8585; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Anot Medical ASR — Tester</h1>
  <p class="sub">Pick a recording, get a transcript. Runs against your deployed engine. Audio is sent only to your own service.</p>

  <div class="card">
    <label>Service URL</label>
    <input id="url" value="https://anot-med-asr-engine-production.up.railway.app" />
    <label>API key (X-API-Key)</label>
    <input id="key" type="password" placeholder="paste your ANOT_ASR_API_KEY" />
    <div class="row">
      <div><label>Mode</label>
        <select id="mode"><option value="conversation">conversation (visit)</option>
        <option value="dictation">dictation</option></select></div>
      <div><label>Engine</label>
        <select id="engine"><option value="whisper">whisper</option>
        <option value="medasr">medasr</option></select></div>
    </div>
  </div>

  <div class="card">
    <div id="drop">Drag an audio file here, or click to choose<br><small>.m4a .wav .mp3 .flac .mp4 .aac .ogg</small></div>
    <input id="file" type="file" accept="audio/*,.m4a,.wav,.mp3,.flac,.mp4,.aac,.ogg" style="display:none" />
    <div id="fname" class="sub" style="margin-top:8px"></div>
    <button id="go" disabled>Transcribe</button>
  </div>

  <div class="card" id="out" style="display:none">
    <div id="meta"></div>
    <pre id="transcript"></pre>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let file = null;
  const drop = $('drop'), fileInput = $('file');
  drop.onclick = () => fileInput.click();
  ['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('hot'); }));
  drop.addEventListener('drop', ev => { if (ev.dataTransfer.files[0]) setFile(ev.dataTransfer.files[0]); });
  fileInput.onchange = () => { if (fileInput.files[0]) setFile(fileInput.files[0]); };
  function setFile(f) { file = f; $('fname').textContent = 'Selected: ' + f.name + ' (' + (f.size/1048576).toFixed(2) + ' MB)'; $('go').disabled = false; }

  $('go').onclick = async () => {
    if (!file) return;
    const url = $('url').value.replace(/\/$/, '') + '/api/v1/transcribe';
    const fd = new FormData();
    fd.append('file', file);
    fd.append('mode', $('mode').value);
    fd.append('engine', $('engine').value);
    $('go').disabled = true; $('go').textContent = 'Transcribing… (CPU ~1.3× audio length)';
    $('out').style.display = 'block'; $('meta').innerHTML = ''; $('transcript').textContent = 'Working…';
    const t0 = performance.now();
    try {
      const res = await fetch(url, { method:'POST', headers: { 'X-API-Key': $('key').value }, body: fd });
      const secs = ((performance.now()-t0)/1000).toFixed(1);
      if (!res.ok) {
        const txt = await res.text();
        $('transcript').innerHTML = '<span class="err">HTTP ' + res.status + ' — ' + txt + '</span>';
      } else {
        const d = await res.json();
        const c = d.confidence || {}, p = d.performance || {};
        $('meta').innerHTML =
          '<span class="pill">lang: ' + (d.language||'?') + '</span>' +
          '<span class="pill">duration: ' + (d.duration_seconds||'?') + 's</span>' +
          '<span class="pill">rtf: ' + (p.rtf||'?') + '</span>' +
          '<span class="pill">took: ' + secs + 's</span>' +
          '<span class="pill">low-confidence: ' + (c.low_confidence_segments ?? '?') + '/' + (c.segments_total ?? '?') + '</span>';
        $('transcript').textContent = d.transcript || '(empty transcript)';
      }
    } catch (e) {
      $('transcript').innerHTML = '<span class="err">Request failed: ' + e.message +
        '. If this is a CORS error, serve this page from http://localhost:3000 (see instructions).</span>';
    }
    $('go').disabled = false; $('go').textContent = 'Transcribe';
  };
</script>
</body>
</html>
